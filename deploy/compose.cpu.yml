name: gpthub-image-cpu
services:
  image-cpu:
    image: gpthub-tools-image-cpu:${CPU_IMAGE_VERSION:-dev}
    build:
      context: ../ai-backends/background-remover
    environment:
      U2NET_HOME: /models
      NUMBA_CACHE_DIR: /tmp/numba
      OMP_NUM_THREADS: '3'
      REMOTE_BACKGROUND_URL: ${REMOTE_BACKGROUND_URL:-}
    volumes:
      - ${CPU_MODELS_DIR:-../data/ai-models/rembg}:/models
      - ${CPU_CACHE_DIR:-../data/ai-cache}:/tmp/numba
    ports:
      - '127.0.0.1:${CPU_PORT:-15010}:5010'
    networks:
      tools:
        aliases: [gpthub-image-cpu]
    restart: unless-stopped
    read_only: true
    tmpfs: ['/tmp:size=512m,mode=1777']
    security_opt: ['no-new-privileges:true']
    mem_limit: ${CPU_MEMORY_LIMIT:-12g}
    memswap_limit: ${CPU_MEMORY_LIMIT:-12g}
    cpus: 3.0
    oom_score_adj: 500
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:5010/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s
networks:
  tools:
    external: true
    name: ${TOOLS_NETWORK:-gpthub-tools_internal}
